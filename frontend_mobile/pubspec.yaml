name: monitor_ambiental

description: Monitor mobile de temperatura e umidade.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  audioplayers: ^6.8.1
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
